# Local export isolation test stack
#
# Usage:
#   docker compose -f docker-compose.dev.yml -f docker-compose.export-isolation.yml up -d --build
#
# This stack keeps the API container in NODE_TYPE=slave, adds a dedicated
# export-worker container in NODE_TYPE=master + WORKER_ONLY=true, and provides a
# local MinIO service so the export archive can be uploaded and downloaded.

services:
  new-api:
    environment:
      - NODE_TYPE=slave
      - IMAGE_RESULT_OBJECT_STORE_PROVIDER=s3
      - IMAGE_RESULT_AWS_S3_BUCKET=new-api-export
      - IMAGE_RESULT_AWS_S3_REGION=us-east-1
      - IMAGE_RESULT_AWS_S3_ACCESS_KEY_ID=minioadmin
      - IMAGE_RESULT_AWS_S3_SECRET_ACCESS_KEY=minioadmin
      - IMAGE_RESULT_AWS_S3_ENDPOINT=http://minio:9000
      - IMAGE_RESULT_AWS_S3_PUBLIC_BASE_URL=http://localhost:9000/new-api-export
      - IMAGE_RESULT_AWS_S3_FORCE_PATH_STYLE=true

  export-worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: new-api-dev:local
    container_name: new-api-dev-export-worker
    restart: unless-stopped
    volumes:
      - dev_data:/data
    environment:
      - WORKER_ONLY=true
      - NODE_TYPE=master
      - NODE_NAME=export-worker-local
      - SQL_DSN=postgresql://root:123456@postgres:5432/new-api
      - REDIS_CONN_STRING=redis://redis
      - TZ=Asia/Shanghai
      - BATCH_UPDATE_ENABLED=true
      - IMAGE_RESULT_OBJECT_STORE_PROVIDER=s3
      - IMAGE_RESULT_AWS_S3_BUCKET=new-api-export
      - IMAGE_RESULT_AWS_S3_REGION=us-east-1
      - IMAGE_RESULT_AWS_S3_ACCESS_KEY_ID=minioadmin
      - IMAGE_RESULT_AWS_S3_SECRET_ACCESS_KEY=minioadmin
      - IMAGE_RESULT_AWS_S3_ENDPOINT=http://minio:9000
      - IMAGE_RESULT_AWS_S3_PUBLIC_BASE_URL=http://localhost:9000/new-api-export
      - IMAGE_RESULT_AWS_S3_FORCE_PATH_STYLE=true
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - dev-network

  minio:
    image: minio/minio:latest
    container_name: new-api-dev-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - dev-network

  minio-init:
    image: minio/mc:latest
    container_name: new-api-dev-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -lc
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb -p local/new-api-export || true
        mc anonymous set download local/new-api-export || true
    networks:
      - dev-network

volumes:
  minio_data:
