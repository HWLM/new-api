# Local export isolation test stack
#
# Usage:
#   docker compose -f docker-compose.dev.yml -f docker-compose.export-isolation.yml up -d --build
#
# This stack keeps the API container in NODE_TYPE=slave, adds a dedicated
# export-worker container in NODE_TYPE=master + WORKER_ONLY=true.
#
# NOTE: object storage now uses Aliyun OSS. Replace the placeholder credentials
# and endpoint below with your real OSS bucket; the bundled MinIO service is
# kept only for reference and is no longer wired to the uploader.

services:
  new-api:
    environment:
      - NODE_TYPE=slave
      - IMAGE_RESULT_OBJECT_STORE_PROVIDER=oss
      - IMAGE_RESULT_OSS_BUCKET=new-api-export
      - IMAGE_RESULT_OSS_REGION=cn-hangzhou
      - IMAGE_RESULT_OSS_ACCESS_KEY_ID=your-access-key-id
      - IMAGE_RESULT_OSS_ACCESS_KEY_SECRET=your-access-key-secret
      - IMAGE_RESULT_OSS_ENDPOINT=https://oss-cn-hangzhou.aliyuncs.com
      - IMAGE_RESULT_OSS_PUBLIC_BASE_URL=https://new-api-export.oss-cn-hangzhou.aliyuncs.com

  export-worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: new-api-dev:local
    container_name: new-api-dev-export-worker
    restart: unless-stopped
    volumes:
      - dev_data:/data
    environment:
      - WORKER_ONLY=true
      - NODE_TYPE=master
      - NODE_NAME=export-worker-local
      - SQL_DSN=postgresql://root:123456@postgres:5432/new-api
      - REDIS_CONN_STRING=redis://redis
      - TZ=Asia/Shanghai
      - BATCH_UPDATE_ENABLED=true
      - IMAGE_RESULT_OBJECT_STORE_PROVIDER=oss
      - IMAGE_RESULT_OSS_BUCKET=new-api-export
      - IMAGE_RESULT_OSS_REGION=cn-hangzhou
      - IMAGE_RESULT_OSS_ACCESS_KEY_ID=your-access-key-id
      - IMAGE_RESULT_OSS_ACCESS_KEY_SECRET=your-access-key-secret
      - IMAGE_RESULT_OSS_ENDPOINT=https://oss-cn-hangzhou.aliyuncs.com
      - IMAGE_RESULT_OSS_PUBLIC_BASE_URL=https://new-api-export.oss-cn-hangzhou.aliyuncs.com
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - dev-network
